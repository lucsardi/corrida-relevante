<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/icons/favicon32.png" type="image/x-icon">
  <title>Pagamento da inscrição — Trilha Relevante 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500&family=Caveat:wght@600&display=swap"
    rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <style>
    .payment-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      background:
        linear-gradient(100deg, rgba(10, 20, 15, .92) 0%, rgba(10, 20, 15, .75) 50%, rgba(10, 20, 15, .55) 100%),
        url('assets/images/bg_header2.gif') center/cover no-repeat;
    }

    @media (max-width:991px) {
      .payment-page {
        background:
          linear-gradient(100deg, rgba(10, 20, 15, .92) 0%, rgba(10, 20, 15, .75) 50%, rgba(10, 20, 15, .55) 100%),
          url('assets/images/bg_mobile2.gif') center/cover no-repeat;
      }
    }

    .payment-card {
      background: var(--cream);
      border-radius: 16px;
      max-width: 560px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 30px 70px rgba(0, 0, 0, .4);
    }

    .payment-header {
      background: var(--forest);
      padding: 34px 30px 28px;
      color: #fff;
      text-align: center;
    }

    .payment-logo {
      height: 34px;
      margin-bottom: 16px;
    }

    .payment-header h1 {
      font-size: 38px;
      margin-bottom: 4px;
      color: #fff;
    }

    .payment-header p {
      font-size: 13.5px;
      opacity: .85;
      margin: 0;
      font-weight: 300;
    }

    .payment-amount {
      display: inline-block;
      background: var(--orange);
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: .5px;
      padding: 8px 22px;
      border-radius: 8px;
      margin-top: 14px;
    }

    .payment-body {
      padding: 30px;
    }

    .registrant-note {
      background: #fff;
      border: 1px solid #e2ddd0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13.5px;
      color: #7a7568;
      margin-bottom: 24px;
      text-align: center;
    }

    .registrant-note strong {
      color: var(--forest);
    }

    .qr-box {
      background: #fff;
      border: 1px solid #e2ddd0;
      border-radius: 12px;
      padding: 22px;
      text-align: center;
      margin-bottom: 20px;
    }

    .qr-box img {
      width: 220px;
      height: 220px;
      object-fit: contain;
      margin: 0 auto 16px;
      border: 1px solid #e2ddd0;
      border-radius: 8px;
      padding: 8px;
      background: #fff;
    }

    .qr-box .qr-label {
      font-weight: 600;
      color: var(--forest);
      font-size: 14px;
      margin-bottom: 14px;
    }

    .pix-key-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--cream);
      border: 1px dashed #ddd5c0;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 6px;
    }

    .pix-key-row input {
      border: none;
      background: transparent;
      flex: 1;
      font-size: 13.5px;
      color: var(--charcoal);
      font-weight: 500;
      outline: none;
    }

    .btn-copy {
      background: var(--forest);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      transition: .2s;
    }

    .btn-copy:hover {
      background: var(--forest-2);
      color: #fff;
    }

    .btn-copy.copied {
      background: #2E7D4F;
    }

    .pix-owner {
      font-size: 12px;
      color: #7a7568;
      margin-bottom: 0;
    }

    .upload-section {
      background: #fff;
      border: 1px solid #e2ddd0;
      border-radius: 12px;
      padding: 22px;
    }

    .upload-section label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #8a8470;
      margin-bottom: 8px;
      display: block;
    }

    .upload-section .form-control {
      border: 1px solid #e2ddd0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13.5px;
    }

    .upload-section .form-control:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 .2rem rgba(242, 98, 26, .15);
    }

    .upload-hint {
      font-size: 12px;
      color: #7a7568;
      margin-top: 8px;
    }

    .file-name-preview {
      font-size: 13px;
      color: var(--forest);
      font-weight: 600;
      margin-top: 8px;
      display: none;
    }

    #paymentError {
      display: none;
    }

    .back-home-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #8a8470;
    }

    .back-home-link:hover {
      color: var(--orange);
    }
  </style>
</head>

<body>

  <div class="payment-page">
    <div class="payment-card">
      <div class="payment-header">
        <img src="assets/images/logo_r2_white.png" alt="Trilha Relevante" class="payment-logo">
        <h1>QUASE LÁ!</h1>
        <p>Finalize o pagamento da sua inscrição via Pix.</p>
        <div class="payment-amount" id="paymentAmount">R$ 0,00</div>
      </div>

      <div class="payment-body">
        <div class="registrant-note" id="registrantNote" style="display:none;">
          Inscrição de <strong id="registrantName"></strong> — confirme o pagamento abaixo.
        </div>

        <div class="qr-box">
          <div class="qr-label">Escaneie o QR Code no app do seu banco</div>
          <img src="assets/images/pix_qrcode.png" alt="QR Code Pix">

          <div class="pix-key-row">
            <input type="text" id="pixKeyInput" readonly>
            <button type="button" class="btn-copy" id="copyPixBtn">COPIAR CHAVE</button>
          </div>
          <p class="pix-owner" id="pixOwnerName"></p>
        </div>

        <div class="upload-section">
          <form id="formComprovante" novalidate>
            <label for="comprovanteInput">Enviar comprovante do pagamento</label>
            <input type="file" class="form-control" id="comprovanteInput" accept="image/*,.pdf" required>
            <div class="file-name-preview" id="fileNamePreview"></div>
            <div class="upload-hint">Aceita imagem (JPG, PNG) ou PDF, até 5MB.</div>

            <div class="alert alert-danger mt-3" id="paymentError">
              Não conseguimos enviar seu comprovante. Verifique sua conexão e tente novamente.
            </div>

            <button type="submit" class="btn btn-orange w-100 py-3 mt-3 fw-semibold" id="submitComprovanteBtn">
              ENVIAR COMPROVANTE →
            </button>
          </form>
        </div>

        <a href="index.html" class="back-home-link">← Voltar para o site</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/pagamento.js"></script>

</body>

</html>
